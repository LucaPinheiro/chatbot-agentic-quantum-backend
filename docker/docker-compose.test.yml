version: '3.8'

services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../requirements.txt:/app/requirements.txt
      - ../requirements-dev.txt:/app/requirements-dev.txt
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_DB=quantum_chat_test
    command: pytest tests/ -v
    depends_on:
      - postgres
      - redis
