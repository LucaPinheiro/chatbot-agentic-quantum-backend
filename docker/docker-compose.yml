version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../requirements.txt:/app/requirements.txt
      - ../requirements-dev.txt:/app/requirements-dev.txt
    env_file:
      - ../.env
    environment:
      # As variáveis do .env já são carregadas via env_file, mas você pode sobrescrever se necessário
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../requirements.txt:/app/requirements.txt
      - ../requirements-dev.txt:/app/requirements-dev.txt
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
      # Configurações para o ambiente de teste
      - POSTGRES_DB=quantum_chat_test
    command: pytest tests/ -v
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quantum_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
