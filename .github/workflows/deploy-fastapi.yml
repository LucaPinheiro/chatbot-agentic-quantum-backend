name: Build & Deploy FastAPI to App Runner via ECR

on:
  push:
    branches: [adjusting-dev]
    paths:
      - "app/**"
      - "docker/**"
      - "Dockerfile.prod"
      - ".github/workflows/deploy-fastapi.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-app
  IMAGE_TAG: latest
  APP_RUNNER_ARN: arn:aws:apprunner:us-east-1:790856957430:service/fastapi-app-service/ef0145a0a455420e92974c3657943fac

jobs:
  build-and-deploy:
    name: Build, Push to ECR & Deploy to App Runner
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: 💡 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 🔨 Build Docker Image (linux/amd64)
        run: |
          docker buildx create --use --name multiarch-builder || true
          docker buildx inspect multiarch-builder --bootstrap
          docker buildx build --platform linux/amd64 \
            -f docker/Dockerfile.prod \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            --load .

      - name: 🏷 Tag Docker Image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: 📤 Push Docker Image to ECR
        run: |
          docker push $IMAGE_URI

      # - name: 🚀 Trigger App Runner Deployment
      #   run: |
      #     echo "⚙️ Forcing App Runner redeploy with latest image"
      #     aws apprunner start-deployment \
      #       --service-arn $APP_RUNNER_ARN \
      #       --region $AWS_REGION
