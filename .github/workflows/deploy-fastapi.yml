name: Build & Deploy FastAPI to App Runner via ECR

on:
  push:
    branches: [adjusting-dev]
    paths:
      - "app/**"
      - "docker/**"
      - "Dockerfile.prod"
      - ".github/workflows/deploy-fastapi.yml"
      - "terraform/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-app
  IMAGE_TAG: latest

jobs:
  build-deploy-infra:
    name: Create ECR and Deploy App Runner
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: 💡 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📖 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: 🪑 Terraform Init
        working-directory: terraform
        run: terraform init

      - name: ✅ Terraform Apply (ECR + App Runner)
        working-directory: terraform
        run: |
          terraform apply -auto-approve -var="region=${{ env.AWS_REGION }}"

  build-push-ecr:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: build-deploy-infra

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: 💡 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 🔨 Build Docker Image (linux/amd64)
        run: |
          docker buildx create --use --name multiarch-builder || true
          docker buildx inspect multiarch-builder --bootstrap
          docker buildx build --platform linux/amd64 \
            -f docker/Dockerfile.prod \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            --load .

      - name: 🏷 Tag Docker Image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: 📤 Push Docker Image to ECR
        run: |
          docker push $IMAGE_URI

  trigger-app-runner:
    name: Trigger App Runner Deployment
    runs-on: ubuntu-latest
    needs: build-push-ecr

    steps:
      - name: 💡 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ✨ Start Deployment on App Runner
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='fastapi-app-service'].ServiceArn" --output text)
          if [ -z "$SERVICE_ARN" ]; then
            echo "App Runner service not found. Aborting."
            exit 1
          fi
          aws apprunner start-deployment --service-arn $SERVICE_ARN --region $AWS_REGION
