name: Deploy Terraform to AWS

on:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
      - "lambda/**"

env:
  TF_WORKING_DIR: terraform
  DESTROY_BEFORE_APPLY: true

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: 🥪 Install Lambda deps and build ZIP
        run: |
          cd lambda
          pip install -r requirements.txt -t .
          mkdir -p ../terraform/lambda
          zip -r ../terraform/lambda/summarize_lambda.zip .

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: 🧹 Delete IAM Role if exists (safe fallback)
        run: |
          ROLE_NAME=lambda-chatbot-summary-role

          echo "▶️ Verificando políticas vinculadas ao role: $ROLE_NAME"
          aws iam list-attached-role-policies --role-name $ROLE_NAME --query 'AttachedPolicies[].PolicyArn' --output text | while read -r policy_arn; do
            echo "🔸 Detaching $policy_arn"
            aws iam detach-role-policy --role-name $ROLE_NAME --policy-arn "$policy_arn"
          done

          echo "▶️ Removendo inline policy (se existir)"
          aws iam delete-role-policy --role-name $ROLE_NAME --policy-name lambda-chatbot-policy || echo "🔸 Inline policy não encontrada"

          echo "▶️ Apagando o role"
          aws iam delete-role --role-name $ROLE_NAME || echo "🔸 Role já foi apagado"

      - name: 🧹 Delete Lambda Event Source Mapping (if exists)
        run: |
          FUNCTION_NAME="chatbot_summarize_lambda"
          ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          REGION="sa-east-1"
          SQS_ARN="arn:aws:sqs:$REGION:$ACCOUNT_ID:chatbot-summarization-queue.fifo"

          echo "🔍 Buscando mappings existentes para função $FUNCTION_NAME..."
          UUID=$(aws lambda list-event-source-mappings \
            --function-name "$FUNCTION_NAME" \
            --event-source-arn "$SQS_ARN" \
            --query 'EventSourceMappings[0].UUID' \
            --output text)

          if [ "$UUID" != "None" ]; then
            echo "🗑️ Apagando mapeamento antigo UUID=$UUID"
            aws lambda delete-event-source-mapping --uuid "$UUID"
          else
            echo "✅ Nenhum mapeamento existente encontrado."
          fi

      - name: 🛡 Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: 💨 Terraform Destroy (optional)
        if: env.DESTROY_BEFORE_APPLY == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="region=sa-east-1" \
            -var="dynamo_table_name=session-chatbot" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: 🥪 Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: 🔍 Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="region=sa-east-1" \
            -var="dynamo_table_name=session-chatbot" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: 🚀 Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="region=sa-east-1" \
            -var="dynamo_table_name=session-chatbot" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"
