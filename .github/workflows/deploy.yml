name: Deploy Terraform to AWS

on:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
      - "lambda/**"

env:
  TF_WORKING_DIR: terraform
  DESTROY_BEFORE_APPLY: true

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: 🥪 Install Lambda deps and build ZIP
        run: |
          cd lambda
          pip install -r requirements.txt -t .
          mkdir -p ../terraform/lambda
          zip -r ../terraform/lambda/summarize_lambda.zip .

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: 🧹 Cleanup pré-Terraform (Lambda e IAM Role)
        run: |
          set -e
          echo "🔄 Apagando Lambda function se existir..."
          aws lambda delete-function --function-name chatbot_summarize_lambda || echo "🔸 Lambda não existia"

          echo "🔄 Apagando IAM Role se existir..."
          ROLE_NAME=lambda-chatbot-summary-role

          # Detach managed policies
          POLICIES=$(aws iam list-attached-role-policies --role-name $ROLE_NAME --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
          for policy_arn in $POLICIES; do
            echo "🔸 Detaching $policy_arn"
            aws iam detach-role-policy --role-name $ROLE_NAME --policy-arn "$policy_arn"
          done

          # Delete inline policy
          aws iam delete-role-policy --role-name $ROLE_NAME --policy-name lambda-chatbot-policy || echo "🔸 Inline policy não encontrada"

          # Delete role
          aws iam delete-role --role-name $ROLE_NAME || echo "🔸 Role não existia"

      - name: 🔥 Delete Event Source Mapping (se existir)
        run: |
          UUID=$(aws lambda list-event-source-mappings \
            --function-name chatbot_summarize_lambda \
            --event-source-arn arn:aws:sqs:sa-east-1:${{ secrets.AWS_ACCOUNT_ID }}:chatbot-summarization-queue.fifo \
            --query 'EventSourceMappings[0].UUID' --output text)

          if [ "$UUID" != "None" ]; then
            echo "🗑️ Deletando mapping antigo $UUID"
            aws lambda delete-event-source-mapping --uuid "$UUID"
          else
            echo "✅ Nenhum mapping existente encontrado"
          fi

      - name: 🛡 Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: 💨 Terraform Destroy (optional)
        if: env.DESTROY_BEFORE_APPLY == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="region=sa-east-1" \
            -var="dynamo_table_name=session-chatbot" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: 🥪 Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: 🔍 Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="region=sa-east-1" \
            -var="dynamo_table_name=session-chatbot" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: 🚀 Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="region=sa-east-1" \
            -var="dynamo_table_name=session-chatbot" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}"
